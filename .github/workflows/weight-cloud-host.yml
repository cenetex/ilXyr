name: weight cloud host
on:
  pull_request:
    paths:
      - '.github/workflows/weight-cloud-host.yml'
      - 'scripts/*weight_cloud*'
      - 'scripts/feral_cloud_package.py'
      - 'scripts/package_weight_corpus.py'
      - 'scripts/weight_source_kit.py'
      - 'scripts/test_feral_bootstrap.py'
      - 'scripts/aws/weight35-user-data.sh'
      - 'experiments/research-step-35/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-host:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Exercise controlled cloud lifecycle failures in the fixed runtime
        run: |
          mkdir "$RUNNER_TEMP/weight-cloud-checks"
          docker run --rm --network none --memory 4g --cpus 2 --read-only --tmpfs /tmp:rw,exec,size=256m --env WEIGHT_CLOUD_TEST_RECEIPTS=/work/output --mount "type=bind,src=$PWD,dst=/work/repo,readonly" --mount "type=bind,src=$RUNNER_TEMP/weight-cloud-checks,dst=/work/output" --entrypoint python3 docker.io/library/node@sha256:2e3d655fd1e3ffaa6b5f23ee9f3905a0fd9e8c0a65df94c8ae6e4d18a0f48870 /work/repo/scripts/test_weight_cloud.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weight-cloud-checks
          retention-days: 30
          path: ${{ runner.temp }}/weight-cloud-checks/
