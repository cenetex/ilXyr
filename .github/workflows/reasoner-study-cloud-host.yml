name: Reasoner study cloud package checks
on:
  pull_request:
    paths:
      - 'scripts/*reasoner_study_cloud*'
      - 'scripts/aws/reasoner-46-user-data.sh'
      - 'scripts/package_solomon_cloud.py'
      - 'scripts/feral_cloud_package.py'
      - 'scripts/feral_process.py'
      - 'experiments/research-step-46/**'
      - '.github/workflows/reasoner-study-cloud-host.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/*reasoner_study_cloud*'
      - 'scripts/aws/reasoner-46-user-data.sh'
      - 'scripts/package_solomon_cloud.py'
      - 'scripts/feral_cloud_package.py'
      - 'scripts/feral_process.py'
      - 'experiments/research-step-46/**'
      - '.github/workflows/reasoner-study-cloud-host.yml'
permissions:
  contents: read
jobs:
  host-and-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REASONER_IMAGE: docker.io/library/node@sha256:2e3d655fd1e3ffaa6b5f23ee9f3905a0fd9e8c0a65df94c8ae6e4d18a0f48870
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: atimics/zero-grounded-literary-lm
          ref: 0c5253604593acb3b9294fcc00c90f59b7dbbd3c
          path: upstream-zero
      - name: Check shutdown, failure records and exact result collection
        run: REASONER_CLOUD_TEST_RECEIPTS="$RUNNER_TEMP/host-records" python3 scripts/test_reasoner_study_cloud.py
      - name: Reconstruct the exact source kit and complete prepared inputs
        run: python3 scripts/prepare_reasoner_study_cloud_check.py --repo . --source upstream-zero --output "$RUNNER_TEMP/package"
      - name: Package and verify the committed host
        run: |
          python3 scripts/package_reasoner_study_cloud.py build --repo . --revision "$(git rev-parse HEAD)" --controller "$RUNNER_TEMP/package/controller.tar" --prepared "$RUNNER_TEMP/package/prepared.tar" --output "$RUNNER_TEMP/host.tar" > "$RUNNER_TEMP/package-binding.json"
      - name: Run the opened cases through the fixed runtime
        run: |
          mkdir "$RUNNER_TEMP/runtime-output"
          docker pull "$REASONER_IMAGE"
          docker image inspect "$REASONER_IMAGE" > "$RUNNER_TEMP/runtime-output/image-inspect.json"
          docker run --rm --network none --cgroupns private --read-only --cpus 1 --memory 3g --memory-swap 3g --pids-limit 256 \
            --tmpfs /tmp:rw,exec,size=512m --log-driver none \
            --env CC=/usr/bin/gcc --env NODE_OPTIONS=--max-old-space-size=1536 \
            --env PYTHONDONTWRITEBYTECODE=1 --env PYTHONHASHSEED=0 --env LANG=C --env LC_ALL=C --env TZ=UTC \
            --env OMP_NUM_THREADS=1 --env OPENBLAS_NUM_THREADS=1 --env MKL_NUM_THREADS=1 --env VECLIB_MAXIMUM_THREADS=1 \
            --mount "type=bind,src=$RUNNER_TEMP/package,dst=/work/package,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/runtime-output,dst=/work/output" \
            --entrypoint python3 "$REASONER_IMAGE" /work/package/scripts/reasoner_study_cloud_runtime.py opened \
            --package /work/package --output /work/output/runtime \
            > "$RUNNER_TEMP/runtime-output/stdout.log" 2> "$RUNNER_TEMP/runtime-output/stderr.log"
      - name: Make container records readable
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/runtime-output" ]; then sudo chmod -R a+rX "$RUNNER_TEMP/runtime-output"; fi
      - name: Confirm opened coverage, identity and memory receipts
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'runtime-output'
          r=json.loads((root/'runtime/RUNTIME.json').read_bytes())
          assert r['status']=='complete' and r['fresh_episode_visits']==0 and r['independent_measured_replays']==64
          assert r['stable_rows_sha256']=='fdfc86fe9f096955099bdf622cf6d69aadd9ab2570071ddc6f7774c512dfde36'
          m=r['memory_after'];assert 0<m['peak_bytes']<=3*1024**3 and m['limit_bytes']==3*1024**3 and m['events']['oom_kill']==0
          assert m['cpu']['usage_usec']>r['memory_before']['cpu']['usage_usec']
          images=json.loads((root/'image-inspect.json').read_bytes())
          assert len(images)==1 and images[0]['Id']=='sha256:d07e49b39003f79e067c4434a20b1505ff061d2002e6e5e938c2354d8f8bd807'
          print(json.dumps({k:r[k] for k in ['status','fresh_episode_visits','independent_measured_replays','stable_rows_sha256','memory_after']}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reasoner-study-cloud-package-checks
          path: |
            ${{ runner.temp }}/host-records
            ${{ runner.temp }}/runtime-output
            ${{ runner.temp }}/package-binding.json
