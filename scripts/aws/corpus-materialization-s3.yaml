AWSTemplateFormatVersion: "2010-09-09"
Description: Private, versioned, access-logged S3 storage for an ilXyr corpus materialization.

Parameters:
  CorpusBucketName:
    Type: String
    AllowedPattern: "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
  AccessLogBucketName:
    Type: String
    AllowedPattern: "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
  ProjectId:
    Type: String
    Default: project://ilxyr/feral-7b

Resources:
  AccessLogBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref AccessLogBucketName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: RetainAccessLogsForSevenYears
            Status: Enabled
            ExpirationInDays: 2557
            NoncurrentVersionExpiration:
              NoncurrentDays: 2557
              NewerNoncurrentVersions: 1
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: ilxyr:project
          Value: !Ref ProjectId
        - Key: ilxyr:data-classification
          Value: private-audit-log

  AccessLogBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AccessLogBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowS3ServerAccessLogs
            Effect: Allow
            Principal:
              Service: logging.s3.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub arn:${AWS::Partition}:s3:::${AccessLogBucketName}/s3-access/${CorpusBucketName}/*
            Condition:
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:s3:::${CorpusBucketName}
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !Sub arn:${AWS::Partition}:s3:::${AccessLogBucketName}
              - !Sub arn:${AWS::Partition}:s3:::${AccessLogBucketName}/*
            Condition:
              Bool:
                aws:SecureTransport: false

  CorpusBucket:
    Type: AWS::S3::Bucket
    DependsOn: AccessLogBucketPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref CorpusBucketName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LoggingConfiguration:
        DestinationBucketName: !Ref AccessLogBucket
        LogFilePrefix: !Sub s3-access/${CorpusBucketName}/
        TargetObjectKeyFormat:
          PartitionedPrefix:
            PartitionDateSource: EventTime
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: ilxyr:project
          Value: !Ref ProjectId
        - Key: ilxyr:data-classification
          Value: private-corpus

  CorpusBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CorpusBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !Sub arn:${AWS::Partition}:s3:::${CorpusBucketName}
              - !Sub arn:${AWS::Partition}:s3:::${CorpusBucketName}/*
            Condition:
              Bool:
                aws:SecureTransport: false
          - Sid: DenyWrongEncryption
            Effect: Deny
            Principal: "*"
            Action: s3:PutObject
            Resource: !Sub arn:${AWS::Partition}:s3:::${CorpusBucketName}/*
            Condition:
              StringNotEquals:
                s3:x-amz-server-side-encryption: AES256

Outputs:
  CorpusBucketName:
    Value: !Ref CorpusBucket
  AccessLogBucketName:
    Value: !Ref AccessLogBucket
  Region:
    Value: !Ref AWS::Region
